<html>
  <style>
    .dsp-filter-applet {
      width: 100%;
    }

    .dsp-filter-applet-controls {
      margin-bottom: 2rem;
    }

    .dsp-filter-applet figure {
      margin-bottom: 3rem;
    }

    .dsp-filter-applet figure img {
      display: block;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      max-height: none;
    }

    @media (min-width: 800px) {
      .course .dsp-filter-applet {
        width: 59.3%;
      }

      .course .margin .dsp-filter-applet {
        width: 100%;
      }
    }
  </style>

  The following applet shows one possible filter method for single-sideband modulation. The buttons switch between LSB and USB. The frequencies and the spectrum are adjusted accordingly.<br><br>

  <section class="dsp-filter-applet" aria-label="Filter method for single-sideband modulation">
    <div class="btn-group dsp-filter-applet-controls" role="group" aria-label="Select sideband">
      <button type="button" class="btn btn-primary" data-sideband="lsb" aria-pressed="true">LSB</button>
      <button type="button" class="btn btn-outline-primary" data-sideband="usb" aria-pressed="false">USB</button>
    </div>

    <div data-sideband-panel="lsb">
      <figure>
        <img src="pictures/831.svg" alt="Frequencies with the filter method for LSB">
      </figure>
      <figure>
        <img src="pictures/940.svg" alt="Spectrum with the filter method for LSB">
      </figure>
    </div>

    <div data-sideband-panel="usb" hidden>
      <figure>
        <img src="pictures/832.svg" alt="Frequencies with the filter method for USB">
      </figure>
      <figure>
        <img src="pictures/941.svg" alt="Spectrum with the filter method for USB">
      </figure>
    </div>

    <script>
      (() => {
        const applet = document.currentScript.closest(".dsp-filter-applet");
        const buttons = applet.querySelectorAll("[data-sideband]");
        const panels = applet.querySelectorAll("[data-sideband-panel]");

        function showSideband(sideband) {
          buttons.forEach((button) => {
            const selected = button.dataset.sideband === sideband;
            button.classList.toggle("btn-primary", selected);
            button.classList.toggle("btn-outline-primary", !selected);
            button.setAttribute("aria-pressed", selected);
          });

          panels.forEach((panel) => {
            panel.hidden = panel.dataset.sidebandPanel !== sideband;
          });
        }

        buttons.forEach((button) => {
          button.addEventListener("click", () => showSideband(button.dataset.sideband));
        });
      })();
    </script>
  </section>
</html>
